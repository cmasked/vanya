name: Full Yogya project checks
on:
  push:
    branches: ['person-2/full-project', 'person-5/full-project', 'main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'cmasked/vanya'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yogya_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: yogya_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yogya_test -d yogya_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install -r yogya-data/requirements.txt
          python -m pip install -e yogya-ai-engine
          if test -f yogya-backend/requirements.txt; then
            python -m pip install -r yogya-backend/requirements.txt
          fi
      - name: Original data pipeline tests
        working-directory: yogya-data
        run: python -m pytest tests -q
      - name: Backend compilation and PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://yogya_test:local_ci_only@localhost:5432/yogya_test
        run: |
          if test -d yogya-backend; then
            cd yogya-backend
            python -m compileall -q .
            python -m pytest tests -q
          fi
      - name: Install mobile dependencies
        working-directory: yogya-mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Mobile TypeScript and queue checks
        working-directory: yogya-mobile
        run: |
          npx tsc --noEmit
          if test -f tests/account-integration.test.cjs; then
            node tests/account-integration.test.cjs
          fi
          if test -f tests/offline.test.mjs; then
            node tests/offline.test.mjs
          fi
          npx expo install --check
      - name: Real HTTP queue and backend integration
        env:
          YOGYA_INTEGRATION_DATABASE_URL: postgresql://yogya_test:local_ci_only@localhost:5432/yogya_test
        run: |
          if test -d yogya-backend && test -f handoff/run_integration_qa.py; then
            python handoff/run_integration_qa.py
          fi
      - name: Commit the tested mobile dependency lock on project branches
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- yogya-mobile/package-lock.json; then
            case "$GITHUB_REF_NAME" in
              main|person-2/full-project|person-5/full-project) ;;
              *) exit 1 ;;
            esac
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yogya-mobile/package-lock.json
            git commit -m "build: commit the verified mobile dependency lock"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
